[project]
name = "dfl-portfolio"
version = "0.1.0"
description = "Decision-focused learning for long-only mean-variance portfolios: KKT one-stage model, closed-form baselines and a two-asset brute-force reference."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kensei Nosaka" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pyomo>=6.7",
]

[project.optional-dependencies]
gurobi = ["gurobipy>=11"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "scipy>=1.11",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dfl_portfolio"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["solver: needs Gurobi or Knitro; skipped automatically when neither is available"]
